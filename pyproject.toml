[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "admri"
version = "0.2.0"
description = "Leakage-aware evaluation of dementia classification from MRI slices: slice- vs subject-level splits, subject-level cross-validation, Grad-CAM."
authors = [{ name = "Şule Özdamar" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1", "torchvision>=0.16", "numpy", "pandas", "scikit-learn", "pillow", "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B905"]
